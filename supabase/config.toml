# Supabase CLI settings for local development (`npx supabase start`).
# Hosted projects are configured in the Supabase dashboard; see README "Setup".
project_id = "glide5portal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
# Local email inbox for invitations and password resets: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
# Invite-only: HR adds employees from the portal. Nobody can sign themselves up.
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = true

[auth.email.template.invite]
subject = "You're invited to Glide5 Portal"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Glide5 Portal password"
content_path = "./supabase/templates/recovery.html"
